server {
    listen 127.0.0.1:80;
    server_name _;

    root /var/www/dima404;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/dima404.access.log;
    error_log  /var/log/nginx/dima404.error.log;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ~* \.(css|js|webp|png|jpg|jpeg|svg|woff2|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
